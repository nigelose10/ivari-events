<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>IVARI</title>

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Craft extraordinary gatherings with AI-generated environments." />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Browser-tab favicons. SVG is preferred when supported; PNG fallbacks
         for Safari and legacy browsers. .ico kept for ancient clients. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- iOS — full-screen standalone & translucent status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IVARI" />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS home-screen icons -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <!-- iOS splash screens (placeholders — replace PNGs with real ones, see /icons/splash/) -->
    <!-- iPhone SE (2nd/3rd gen) — 750x1334 @2x portrait -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash/apple-splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- iPhone 14 / 13 / 12 — 1170x2532 @3x portrait -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash/apple-splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 14 Pro / 15 — 1179x2556 @3x portrait -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash/apple-splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 14 Pro Max / 15 Plus — 1290x2796 @3x portrait -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash/apple-splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 15 Pro Max — 1320x2868 @3x portrait -->
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash/apple-splash-1320x2868.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <!-- Fonts via Fontshare (no Google Fonts fingerprint).
         Display: Cabinet Grotesk (editorial). Body: Satoshi (humanist sans). -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800,900&f[]=satoshi@400,500,700,900&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Theme bootstrap — applied before React mounts to avoid flash of wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ivari:theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) { /* localStorage blocked — fall back to system pref */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Umami analytics — disabled. Re-enable by adding the script with VITE_ANALYTICS_ENDPOINT/VITE_ANALYTICS_WEBSITE_ID. -->
  </body>

</html>
